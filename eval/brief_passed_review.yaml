# The briefs that went out under the final prompt, read for what the number
# check can't see (M5 step 9): eval/brief_passed.py checks this file
# against the logs and counts it.
#
# One entry per brief that went out (nova-v2 46, sonnet-v2 38), keyed to its
# log; each finding quotes the brief as the log holds it. Verdicts: wrong (a
# fact contradicts it), invented (a claim no fact supports), cause (a cause,
# explanation, advice, or action the facts don't give), status (an alert's
# new/open label or since-date against the ledger's): each misleading. minor:
# worth a note, misleads no one.
#
# How it was read: alert statuses by script first (`brief_passed.py
# statuses`: 104 alert mentions, none mislabelled, four unclear read by hand).
# Then a first read of every brief by four reviewers (Claude subagents, one
# rubric, eval/brief_passed_rubric.md, each brief beside the facts the model
# was given). Every quote is checked against the log by machine, and every
# finding was then checked by hand against the facts, which changed these:
#   minor -> wrong: Nova's alert lines that write PB-02 2nd shift's gap against
#     "PB-02" (Jul 8, 17, 23, Aug 3, 4, 12), as the reviewers had already ruled
#     for the same thing in margin bullets; Sonnet's two self-corrections
#     (Jul 10 "wait —", Sep 28 "baseline 598... baseline 544"), as the refused
#     Aug 10 brief's "wait, 0.9%" was ruled.
#   minor -> invented: Sonnet Aug 21's ⚠ on LSR-01's stops (its alert is scrap),
#     as Sep 9's ⚠ on LSR-01 was ruled.
#   wrong -> minor: Nova Jul 30 "0 recorded stop minutes" and Aug 18 "no stops
#     at all": true of the machine data, as Jul 16's "no stops" was left.
#   dropped: "ERP uses standard hours" (Sep 25), "ERP closes jobs nightly"
#     (Sep 8, 9): the model was told both (the glossary, the margin window's note).
# Rule for an alert or margin line that drops the shift: a number written
# against the bare machine is wrong; a line naming no machine is minor.

out: out-m5
