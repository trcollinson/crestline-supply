# The brief backtest's narration orphans, read by hand (M5 step 5).
#
# The number check fails a brief for any number it can't tie to a fact cited
# beside it. Most failures are a right number cited in the wrong place (a
# count in a heading, cited in the paragraph below). These are the ones that
# would have put a wrong or made-up number in front of the plant manager,
# read against that morning's facts (<out>/brief/facts/<morning>.json).
# Every one was refused by the check: the template went out instead.
#
#   wrong     a value no fact gives for what the sentence says it is
#   computed  worked out from facts (the prompt forbids it), arithmetic right
#   invented  a claim with a number no fact holds
#
#   right     a fact's number, cited in the wrong place or not at all
#
# Seed 42's backfill (out-m5), brief.sql's thresholds from M5 step 5.
# brief_scoring.py reads this file; an entry whose orphan isn't in the logs
# fails the score, so the readings can't drift from the runs.

