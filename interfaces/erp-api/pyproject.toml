[project]
name = "crestline-erp-api"
version = "0.1.0"
description = "Crestline's ERP REST API, served from the ERP store"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "mangum>=0.22.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
