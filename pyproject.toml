[project]
name = "crestline"
version = "0.1.0"
description = "Crestline Supply plant simulator and data platform"
authors = [
    { name = "Tim Collinson", email = "trcollinson@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.105",
    "duckdb>=1.5.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "simpy>=4.1.2",
]

[project.scripts]
crestline = "crestline.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
infra = [
    "aws-cdk-lib>=2.272.0",
    "constructs>=10.8.1",
]
# The services in interfaces/ are packaged on their own; installing them here
# lets the tests import them and `uv run` start them.
interfaces = [
    "crestline-erp-api",
]
pipelines = [
    "crestline-pipelines",
]

[tool.uv]
# The CDK app in infra/ is part of the project, so its tests run with the rest.
default-groups = ["dev", "infra", "interfaces", "pipelines"]

[tool.uv.workspace]
members = ["interfaces/erp-api", "pipelines"]

[tool.uv.sources]
crestline-erp-api = { workspace = true }
crestline-pipelines = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra", "eval"]
filterwarnings = [
    # Mangum asks for an event loop when it starts; Lambda has one, a test doesn't.
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]

[tool.ruff]
target-version = "py312"
# First-party code: the package, the CDK app (`app`, `stacks`), the eval, and
# the interface services.
src = [".", "src", "infra", "eval", "pipelines", "interfaces/erp-api/src"]
